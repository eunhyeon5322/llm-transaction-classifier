server:
  port: 8080

spring:
  application:
    name: llm-transaction-classifier

  datasource:
    url: jdbc:mysql://localhost:3307/llm_classifier?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: classifier
    password: classifier
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
