services:
  mysql:
    image: mysql:8.0
    container_name: llm-classifier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: llm_classifier
      MYSQL_USER: classifier
      MYSQL_PASSWORD: classifier
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: llm-classifier-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
    name: llm-classifier-mysql-data
  redis-data:
    name: llm-classifier-redis-data
